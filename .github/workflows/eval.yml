name: SenseCheck Eval

on:
  pull_request:
    paths:
      - "packages/core/src/sensecheck/prompt.ts"
      - "packages/core/src/sensecheck/eval/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run SenseCheck eval (gates prompt changes)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run eval
